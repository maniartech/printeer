name: CI

on:
  push:
    branches: [master, jun26-fixes]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]

    env:
      # Use the bundled Chromium and disable the sandbox so headless Chrome
      # launches reliably on CI Linux runners (harmless on Windows).
      PRINTEER_BUNDLED_ONLY: '1'
      PRINTEER_NO_SANDBOX: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Non-blocking until the lint debt (tracked in docs/bug-fixes) is cleared,
        # then this becomes a hard gate.
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests (built CLI + library, real Chromium)
        run: npm run test:e2e

      - name: Verify publish contents
        run: npm pack --dry-run
