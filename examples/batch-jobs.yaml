# Printeer batch file.
#
# - `defaults` are merged into every job (a job's own value wins; `config` is
#   deep-merged). Only per-job fields are valid here (preset, config, timeout,
#   retryCount, priority, variables).
# - `variables` are available to every job for `{{name}}` substitution in url,
#   output, and any string inside `config`. Per-job `variables` override these.
# - Set the output directory with the CLI's `--output-dir`, or bake it into the
#   `output` paths (as below via `{{outputPath}}`).
# - Per-job retries also come from the CLI's `--retry`.

metadata:
  name: "Comprehensive Website Conversion"
  version: "1.0"
  created: "2025-09-12T10:00:00Z"
  description: "Convert multiple website pages with different configurations"

defaults:
  preset: "web-article"
  timeout: 30000
  retryCount: 2

variables:
  baseUrl: "https://example.com"
  outputPath: "./reports"
  companyName: "Acme Corporation"

jobs:
  - id: "homepage"
    url: "{{baseUrl}}"
    output: "{{outputPath}}/homepage.pdf"
    preset: "web-article"
    priority: 1
    variables:
      title: "{{companyName}} Homepage"
      section: "main"
    config:
      pdf:
        headerTemplate: "corporate-header"
        footerTemplate: "simple-footer"
        displayHeaderFooter: true

  - id: "about-page"
    url: "{{baseUrl}}/about"
    output: "{{outputPath}}/about.pdf"
    dependencies: ["homepage"]
    variables:
      title: "About {{companyName}}"
      section: "about"

  - id: "mobile-screenshot"
    url: "{{baseUrl}}"
    output: "{{outputPath}}/homepage-mobile.png"
    preset: "mobile-responsive"
    config:
      image:
        type: "png"
        quality: 95